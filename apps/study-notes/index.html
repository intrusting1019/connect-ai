<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>밑줄 학습 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 왼쪽은 노트 서랍(검색·과목·목록), 오른쪽은 책상 위에 놓인 코넬 노트 한 장.
   라이트 테마는 줄 노트, 다크 테마는 칠판. 빨간 여백선이 단서 칸과 필기 칸을 가른다. */
:root {
  --bg: #e9edf4; --pane: #f4f6fa; --paper: #fefefc;
  --fg: #1b2233; --muted: #566076; --faint: #8a94a8;
  --line: #d3d9e4; --rule: #d4e0f2; --margin: #e0637a;
  --accent: #2447c8; --accent-fg: #ffffff; --accent-soft: #e2e8fb;
  --hl: #ffe35a; --hl-fg: #43370a; --danger: #c5303f;
  --ink0: #1b2233; --ink1: #2447c8; --ink2: #d2354a; --inkhl: rgba(255, 216, 20, .5);
  --s0: #2447c8; --s1: #0f8a6a; --s2: #c2571a; --s3: #8a3fc0; --s4: #c22f6b; --s5: #5b6b82;
  --shadow: 0 10px 28px -18px rgba(27, 34, 51, .45);
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-hand: "Gaegu", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --lh: 30px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111a17; --pane: #16221d; --paper: #1d2f28;
    --fg: #eef1e4; --muted: #aab8ac; --faint: #7d8f84;
    --line: #31453c; --rule: #2c463c; --margin: #d98490;
    --accent: #a5c6ff; --accent-fg: #0e1c36; --accent-soft: #22384a;
    --hl: #f0d54e; --hl-fg: #2b2400; --danger: #ff8f9b;
    --ink0: #f1f3ea; --ink1: #9dc1ff; --ink2: #ff97a6; --inkhl: rgba(240, 213, 78, .38);
    --s0: #9dc1ff; --s1: #6fd6b3; --s2: #f0a36b; --s3: #c9a0f0; --s4: #f291b8; --s5: #a9b6c6;
    --shadow: 0 10px 28px -18px rgba(0, 0, 0, .8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111a17; --pane: #16221d; --paper: #1d2f28;
  --fg: #eef1e4; --muted: #aab8ac; --faint: #7d8f84;
  --line: #31453c; --rule: #2c463c; --margin: #d98490;
  --accent: #a5c6ff; --accent-fg: #0e1c36; --accent-soft: #22384a;
  --hl: #f0d54e; --hl-fg: #2b2400; --danger: #ff8f9b;
  --ink0: #f1f3ea; --ink1: #9dc1ff; --ink2: #ff97a6; --inkhl: rgba(240, 213, 78, .38);
  --s0: #9dc1ff; --s1: #6fd6b3; --s2: #f0a36b; --s3: #c9a0f0; --s4: #f291b8; --s5: #a9b6c6;
  --shadow: 0 10px 28px -18px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.55 var(--font-body); -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h2, h3 { text-wrap: balance; }

/* ---------- 틀 ---------- */
#app { height: 100%; display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); }
.list-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--pane); border-right: 1px solid var(--line); }
.edit-pane { min-width: 0; min-height: 0; overflow-y: auto; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.btn.only-narrow, .list-note .row-btns.dup-cta { display: none; }
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  #app:not(.show-editor) .edit-pane { display: none; }
  #app.show-editor .list-pane { display: none; }
  .list-pane { border-right: 0; }
  .btn.only-narrow { display: inline-flex; }
  .list-note .row-btns.dup-cta { display: flex; }
  .title { font-size: 25px; }
  .cols, .row, .add-line { grid-template-columns: minmax(92px, 34%) minmax(0, 1fr); }
  .row > .cue { font-size: 17px; }
  .sheet textarea, .static-cell, .cols > *, .add-line > * { padding-left: 9px; padding-right: 9px; }
  .row > .body { padding-right: 30px; }
}

/* ---------- 공통 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px;
  padding: 6px 13px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--paper); color: var(--fg); white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.quiet { background: transparent; border-color: transparent; color: var(--muted); }
.btn.quiet:hover { background: var(--accent-soft); color: var(--fg); }
.btn.danger { color: var(--danger); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- 목록 칸 ---------- */
.lp-head { display: flex; align-items: center; gap: 8px; padding-block: 14px 8px; }
.logo { font: 700 30px/1 var(--font-hand); letter-spacing: -.04em; text-decoration: underline; text-decoration-color: var(--hl); text-decoration-thickness: 6px; text-underline-offset: 2px; text-decoration-skip-ink: none; }
.logo-sub { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-top: 6px; }
.status { margin-left: auto; min-height: 28px; padding: 2px 9px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--muted); font-size: 12px; }
.status:disabled { cursor: default; }
.status.error { border-color: var(--danger); color: var(--danger); }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 20; min-width: 190px; padding: 6px;
  display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
}
.menu button { text-align: left; padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; }
.menu button:hover { background: var(--accent-soft); }
.lp-tools { display: flex; gap: 8px; padding-block: 4px 10px; }
#q { flex: 1; min-width: 0; min-height: 38px; padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-block: 2px 10px; scrollbar-width: thin; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 32px; padding: 3px 11px;
  border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap;
}
.chip[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--paper); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .75; }
.chip .due-n { padding: 0 6px; border-radius: 999px; background: var(--hl); color: var(--hl-fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--faint); }
.list { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid var(--line); padding-block: 6px 24px; }
.list-note { display: flex; flex-direction: column; gap: 10px; padding-block: 28px; color: var(--muted); }
.list-note strong { color: var(--fg); font: 700 22px/1.25 var(--font-hand); letter-spacing: -.04em; }
.list-note .row-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.note-item {
  display: grid; gap: 2px; width: 100%; padding: 11px 12px; margin-block: 2px; text-align: left;
  border: 1px solid transparent; border-radius: 10px; background: transparent;
}
.note-item:hover { background: var(--accent-soft); }
.note-item[aria-current="true"] { background: var(--paper); border-color: var(--line); box-shadow: var(--shadow); }
.ni-top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); min-width: 0; }
.ni-top .subj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ni-top .date { margin-left: auto; flex: none; font-variant-numeric: tabular-nums; }
.ni-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ni-snippet { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ni-foot { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--faint); }
.tagchip { padding: 0 7px; border-radius: 999px; background: var(--hl); color: var(--hl-fg); font-weight: 600; }
.pin-mark { color: var(--margin); font-weight: 600; }

/* ---------- 책상 / 노트 한 장 ---------- */
.desk { max-width: 920px; margin: 0 auto; padding-block: 14px 56px; display: flex; flex-direction: column; gap: 12px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .spacer { flex: 1; }
.tabs { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--pane); }
.tabs button { min-height: 32px; padding: 3px 12px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); min-width: 0; }
.sheet-head { padding: 18px 18px 12px; border-bottom: 2px solid var(--fg); display: grid; gap: 8px; }
.title { width: 100%; padding: 0; border: 0; background: transparent; font: 700 30px/1.25 var(--font-hand); letter-spacing: -.04em; }
.title::placeholder, .sheet textarea::placeholder { color: var(--faint); opacity: 1; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 13px; color: var(--muted); }
.meta select, .meta input { min-height: 32px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 7px; background: transparent; }
.meta input { flex: 1; min-width: 140px; }
.meta .when { font-variant-numeric: tabular-nums; }
.cols, .row, .add-line { display: grid; grid-template-columns: minmax(92px, 30%) minmax(0, 1fr); }
.cols > *, .add-line > * { padding: 5px 12px; }
.cols { font-size: 12px; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--rule); }
.cols > :first-child, .add-line > :first-child, .row > .cue { border-right: 1.5px solid var(--margin); }
.row { position: relative; border-bottom: 1px solid var(--line); }
.sheet textarea {
  display: block; width: 100%; margin: 0; padding: 0 12px; border: 0; border-radius: 0; resize: none; overflow: hidden;
  background: linear-gradient(to bottom, transparent calc(var(--lh) - 1px), var(--rule) calc(var(--lh) - 1px)) 0 0 / 100% var(--lh);
  line-height: var(--lh); min-height: var(--lh); overflow-wrap: anywhere;
}
.sheet textarea:focus-visible { outline: 0; box-shadow: inset 0 0 0 2px var(--accent-soft); }
.row > .cue { font: 700 19px/var(--lh) var(--font-hand); letter-spacing: -.04em; color: var(--accent); }
.row > .body { padding-right: 36px; }
.row-del {
  position: absolute; right: 4px; top: 2px; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 6px;
  background: transparent; color: var(--faint); font-size: 18px; line-height: 1; opacity: 0;
}
.row:hover .row-del, .row:focus-within .row-del { opacity: 1; }
.row-del:hover { color: var(--danger); background: var(--accent-soft); }
.add-line button { justify-self: start; border: 0; background: transparent; color: var(--accent); padding: 4px 0; min-height: 32px; }
.add-line .hint { font-size: 12px; color: var(--faint); margin-left: 10px; }
.summary { border-top: 1.5px solid var(--margin); }
.summary label { display: block; padding: 8px 12px 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.static-cell { padding: 0 12px; line-height: var(--lh); white-space: pre-wrap; overflow-wrap: anywhere; }
.note-msg { padding: 40px 18px; color: var(--muted); }

/* ---------- 손필기 ---------- */
.ink-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--pane); }
.ink-bar .btn { min-height: 34px; padding: 4px 10px; }
.swatch { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); display: inline-grid; place-items: center; }
.swatch i { width: 16px; height: 16px; border-radius: 50%; }
.swatch[aria-pressed="true"] { border-color: var(--fg); }
.sep { width: 1px; align-self: stretch; background: var(--line); }
.ink-page { position: relative; aspect-ratio: 1000 / 1414; max-width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); overflow: hidden; }
.ink-page canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.ink-live { touch-action: none; cursor: crosshair; }
.tool-move .ink-live { touch-action: pan-y; cursor: default; }
.ink-no { position: absolute; right: 10px; bottom: 6px; font-size: 12px; color: var(--faint); pointer-events: none; font-variant-numeric: tabular-nums; }

/* ---------- 복습 ---------- */
.review { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: var(--shadow); padding: 22px 20px 24px; display: grid; gap: 16px; }
.progress { height: 6px; border-radius: 999px; background: var(--rule); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.q { font: 700 28px/1.3 var(--font-hand); letter-spacing: -.04em; color: var(--accent); overflow-wrap: anywhere; }
.a { padding: 12px 14px; border-left: 1.5px solid var(--margin); white-space: pre-wrap; overflow-wrap: anywhere; line-height: var(--lh); max-width: 65ch; }
.a.veil { color: var(--faint); font-style: normal; }
.kbd { font-size: 12px; color: var(--faint); }
.result-big { font: 700 34px/1.2 var(--font-hand); letter-spacing: -.04em; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.steps li { padding: 2px 10px; border: 1px solid var(--line); border-radius: 999px; }
.steps li.on { background: var(--hl); color: var(--hl-fg); border-color: transparent; font-weight: 600; }

/* ---------- 대화상자 · 알림 ---------- */
.dlg { width: min(460px, calc(100vw - 32px)); padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--fg); box-shadow: var(--shadow); }
.dlg::backdrop { background: rgba(10, 14, 22, .45); }
.dlg h2 { font-size: 17px; margin-bottom: 10px; }
.dlg p { color: var(--muted); }
.dlg textarea { width: 100%; min-height: 160px; margin-top: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--pane); font-size: 12px; }
.dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 16px; }
.subj-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.subj-row input { flex: 1; min-width: 0; min-height: 38px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50; max-width: calc(100vw - 32px);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px;
  background: var(--fg); color: var(--paper); box-shadow: var(--shadow); font-size: 14px;
}
.toast button { border: 0; background: transparent; color: var(--hl); font-weight: 600; padding: 2px 4px; }
@media (prefers-reduced-motion: no-preference) {
  .note-item, .btn, .chip { transition: background-color .12s, border-color .12s; }
}
</style>
</head>
<body>
<div id="app">
  <aside class="list-pane gutter" aria-label="노트 목록">
    <header class="lp-head">
      <div>
        <h1 class="logo">밑줄</h1>
        <p class="logo-sub">코넬식 학습 노트</p>
      </div>
      <button id="status" class="status" type="button" disabled>불러오는 중…</button>
      <div class="menu-wrap">
        <button id="menu-btn" class="btn quiet" type="button" aria-haspopup="true" aria-expanded="false" aria-label="메뉴">메뉴</button>
        <div id="menu" class="menu" hidden>
          <button type="button" data-act="subjects">과목 관리</button>
          <button type="button" data-act="export">백업 내보내기 (.json)</button>
          <button type="button" data-act="import">백업 가져오기</button>
        </div>
      </div>
    </header>
    <div class="lp-tools">
      <input id="q" type="search" placeholder="제목 · 내용 · 태그 검색" autocomplete="off" aria-label="노트 검색">
      <button id="new-note" class="btn primary" type="button">새 노트</button>
    </div>
    <nav id="chips" class="chips" aria-label="과목으로 거르기"></nav>
    <div id="list" class="list"><div class="list-note"><p>노트를 불러오는 중…</p></div></div>
  </aside>
  <main id="editor" class="edit-pane"></main>
</div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
document.documentElement.lang = 'ko';

/* ================= 도우미 ================= */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  return add(el, kids);
}
/* 배열·null이 섞인 자식을 안전하게 붙인다 (DOM의 append는 배열과 null을 글자로 바꿔 버린다) */
function add(el, ...kids) {
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const put = (el, ...kids) => { el.replaceChildren(); return add(el, kids); };
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseYmd = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const fmtDay = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일`;
const clone = (o) => JSON.parse(JSON.stringify(o));
const wide = () => matchMedia('(min-width: 761px)').matches;
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

/* ================= 상태 ================= */
const STEPS = [1, 3, 7, 14, 30];               // 복습 간격(일): 잘 떠올릴 때마다 한 칸씩 늘어난다
const S = {
  ready: false, loadError: false,
  notes: new Map(), meta: { kind: 'meta', subjects: [] },
  filter: 'all', q: '', currentId: null, tab: 'text', review: null,
  ink: { tool: 'pen', color: 0, width: 3.5 },
};
let backend = null;
let pads = [];
let inkOrder = [];
const inArtifact = !!(window.claude && typeof window.claude.use === 'function');
let downloadsP = Promise.resolve(null);

function normalizeNote(id, d) {
  d = d || {};
  const rows = Array.isArray(d.rows) ? d.rows.map((r) => ({ cue: String(r?.cue ?? ''), body: String(r?.body ?? '') })) : [];
  return {
    id, title: String(d.title ?? ''), subject: String(d.subject ?? ''),
    tags: Array.isArray(d.tags) ? d.tags.map(String) : [],
    rows: rows.length ? rows : [{ cue: '', body: '' }],
    summary: String(d.summary ?? ''), pinned: !!d.pinned,
    created: Number(d.created) || Date.now(), updated: Number(d.updated) || Date.now(),
    stage: Math.max(0, Math.min(STEPS.length, Number(d.stage) || 0)),
    due: /^\d{4}-\d{2}-\d{2}$/.test(d.due) ? d.due : addDays(ymd(), 1),
    lastReview: Number(d.lastReview) || 0, inkPages: Math.max(0, Number(d.inkPages) || 0),
  };
}
const serializeNote = (n) => ({
  kind: 'note', title: n.title, subject: n.subject, tags: n.tags, rows: n.rows, summary: n.summary, pinned: n.pinned,
  created: n.created, updated: n.updated, stage: n.stage, due: n.due, lastReview: n.lastReview, inkPages: n.inkPages,
});
const hasContent = (n) => !!(n.title.trim() || n.summary.trim() || n.inkPages || n.rows.some((r) => r.cue.trim() || r.body.trim()));
const isDue = (n, today = ymd()) => hasContent(n) && n.due <= today;
const subjectOf = (n) => S.meta.subjects.find((s) => s.id === n.subject) || null;
function dueLabel(n) {
  const diff = dayDiff(ymd(), n.due);
  if (diff < 0) return `복습 ${-diff}일 밀림`;
  if (diff === 0) return '오늘 복습';
  if (diff === 1) return '내일 복습';
  return `${diff}일 뒤 복습`;
}

/* ================= 저장소 =================
   Claude 아티팩트 안에서는 계정별 비공개 저장소(db)를, 그 밖에서는 이 브라우저(localStorage)를 쓴다.
   경로: meta · <노트id> · <노트id>/ink/p<쪽> */
const LS = 'miljul:v1:';
function localBackend() {
  let ok = false;
  try { localStorage.setItem(LS + '__t', '1'); localStorage.removeItem(LS + '__t'); ok = true; } catch { /* 저장소 차단 */ }
  const mem = new Map();
  const read = (k) => { if (!ok) return mem.get(k) ?? null; const v = localStorage.getItem(LS + k); return v == null ? null : JSON.parse(v); };
  return {
    kind: ok ? 'local' : 'memory',
    async loadAll() {
      const keys = ok ? Array.from({ length: localStorage.length }, (_, i) => localStorage.key(i)).filter((k) => k && k.startsWith(LS)).map((k) => k.slice(LS.length)) : [...mem.keys()];
      const notes = [];
      let meta = null;
      for (const k of keys) {
        if (k.includes('/')) continue;
        try { const d = read(k); if (k === 'meta') meta = d; else if (d) notes.push({ id: k, data: d }); } catch { /* 깨진 항목은 건너뛴다 */ }
      }
      return { meta, notes };
    },
    async get(path) { try { return read(path); } catch { return null; } },
    async set(path, data) { if (ok) localStorage.setItem(LS + path, JSON.stringify(data)); else mem.set(path, clone(data)); },
    async del(path) { if (ok) localStorage.removeItem(LS + path); else mem.delete(path); },
  };
}
function cloudBackend(db, userId) {
  const root = db.collection('data/users/' + userId);
  const ref = (path) => {
    const p = path.split('/');
    let r = root.doc(p[0]);
    for (let i = 1; i + 1 < p.length; i += 2) r = r.collection(p[i]).doc(p[i + 1]);
    return r;
  };
  const once = async (fn) => {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 600 + Math.random() * 900)); return fn(); }
      throw e;
    }
  };
  return {
    kind: 'cloud',
    async loadAll() {
      const snap = await once(() => root.limit(1000).get());
      const notes = [];
      let meta = null;
      for (const d of snap.docs) { const data = clone(d.data() || {}); if (d.id === 'meta') meta = data; else notes.push({ id: d.id, data }); }
      return { meta, notes };
    },
    async get(path) { const s = await once(() => ref(path).get()); return s.exists ? clone(s.data()) : null; },
    set(path, data) { return once(() => ref(path).set(data)); },
    del(path) { return once(() => ref(path).delete()); },
  };
}
async function pickBackend() {
  if (inArtifact) {
    try {
      downloadsP = window.claude.use('downloads').catch(() => null);
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const id = user ? await user.id() : null;
      if (db && id) return cloudBackend(db, id);
    } catch { /* 이 화면에서는 계정 저장소를 못 쓴다 → 브라우저 저장으로 */ }
  }
  return localBackend();
}

/* 문서 하나에 한 번에 한 쓰기만. 입력이 몰리면 마지막 상태 한 번만 쓴다. */
const saver = { pending: new Map(), inflight: new Set(), timer: 0, failed: false };
function queueSave(path, producer, delay = 700) {
  saver.pending.set(path, producer);
  setStatus();
  clearTimeout(saver.timer);
  saver.timer = setTimeout(flush, delay);
}
function flush() {
  clearTimeout(saver.timer);
  for (const path of [...saver.pending.keys()]) writeOne(path);
}
async function writeOne(path) {
  if (!backend || saver.inflight.has(path)) return;
  const producer = saver.pending.get(path);
  saver.pending.delete(path);
  saver.inflight.add(path);
  setStatus();
  let ok = true;
  try {
    const data = producer();
    if (data == null) await backend.del(path); else await backend.set(path, data);
  } catch (e) {
    ok = false;
    if (!saver.pending.has(path)) saver.pending.set(path, producer);
    if (!saver.failed) toast(e && e.code === 'quota_exceeded' ? '저장 공간이 가득 찼어요. 안 쓰는 노트를 지워 주세요.' : '저장하지 못했어요. 메뉴에서 백업을 내보내 두세요.');
    saver.failed = true;
  }
  saver.inflight.delete(path);
  if (ok) { if (!saver.pending.size) saver.failed = false; if (saver.pending.has(path)) return writeOne(path); }
  setStatus();
}
function setStatus() {
  const el = $('#status');
  const busy = saver.inflight.size || (saver.pending.size && !saver.failed);
  el.classList.toggle('error', !busy && saver.failed);
  el.disabled = busy || !saver.failed;
  if (!S.ready) el.textContent = S.loadError ? '불러오지 못함' : '불러오는 중…';
  else if (busy) el.textContent = '저장 중…';
  else if (saver.failed) el.textContent = '저장 실패 · 다시 시도';
  else el.textContent = { cloud: '계정에 저장됨', local: '이 브라우저에 저장됨', memory: '저장 안 됨 (임시)' }[backend.kind];
  el.title = S.ready ? { cloud: 'Claude 계정에 저장돼요. 다른 기기에서 열어도 보여요.', local: '이 브라우저에만 저장돼요. 메뉴에서 백업을 내보낼 수 있어요.', memory: '브라우저 저장소를 쓸 수 없어 창을 닫으면 사라져요.' }[backend.kind] : '';
}
function touch(note) {
  note.updated = Date.now();
  const id = note.id;
  queueSave(id, () => (S.notes.has(id) ? serializeNote(S.notes.get(id)) : null));
  scheduleList();
}
const saveMeta = () => queueSave('meta', () => clone(S.meta), 300);

/* ================= 알림 · 대화상자 ================= */
let toastTimer = 0;
function toast(msg, action) {
  const el = $('#toast');
  put(el, h('span', null, msg), action ? h('button', { type: 'button', onclick: () => { el.hidden = true; action.fn(); } }, action.label) : null);
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 7000 : 3600);
}
function dialog({ title, body, actions, onClose }) {
  const d = h('dialog', { class: 'dlg' });
  const close = () => { if (d.open) d.close(); };
  add(d, h('h2', null, title), body, h('div', { class: 'dlg-actions' }, actions.map((a) =>
    h('button', { type: 'button', class: 'btn ' + (a.kind || ''), onclick: () => { if (a.fn && a.fn() === false) return; close(); } }, a.label))));
  d.addEventListener('close', () => { d.remove(); if (onClose) onClose(); });
  d.addEventListener('click', (e) => { if (e.target === d) close(); });
  document.body.append(d);

}
async function saveFile(filename, text) {
  const dl = await downloadsP;
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('파일을 저장했어요.'); return; }
    catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; }
  } else if (!inArtifact) {
    const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    const a = h('a', { href: url, download: filename });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return;
  }
  const ta = h('textarea', { readonly: true, 'aria-label': filename, value: text });
  dialog({
    title: '이 화면에서는 파일로 저장할 수 없어요',
    body: h('div', null, h('p', null, `아래 내용을 복사해 ${filename} 파일로 붙여 넣으세요.`), ta),
    actions: [
      { label: '복사', kind: 'primary', fn: () => { const p = navigator.clipboard?.writeText(text); (p || Promise.reject()).then(() => toast('복사했어요.'), () => { ta.focus(); ta.select(); }); return false; } },
      { label: '닫기' },
    ],
  });
}

/* ================= 목록 칸 ================= */
function haystack(n) {
  return [n.title, n.summary, n.tags.join(' '), subjectOf(n)?.name || '', ...n.rows.map((r) => r.cue + ' ' + r.body)].join('\n').toLowerCase();
}
function visibleNotes() {

  else if (S.filter !== 'all') arr = arr.filter((n) => n.subject === S.filter);
  if (q) arr = arr.filter((n) => haystack(n).includes(q));
  return arr.sort((a, b) => (b.pinned - a.pinned) || (b.updated - a.updated));
}

  const listEl = h('div');
  const paint = () => put(listEl,
    S.meta.subjects.length ? null : h('p', null, '과목을 만들면 노트를 과목별로 모아 볼 수 있어요.'),
    S.meta.subjects.map((s) => h('div', { class: 'subj-row' },
      h('button', { type: 'button', class: 'swatch', 'aria-label': '색 바꾸기', title: '색 바꾸기', onclick: () => { s.color = (s.color + 1) % 6; saveMeta(); paint(); } }, h('i', { style: `background:var(--s${s.color % 6})` })),
      h('input', { type: 'text', value: s.name, maxlength: 30, 'aria-label': '과목 이름', oninput: (e) => { s.name = e.target.value.trim() || '이름 없는 과목'; saveMeta(); } }),
      h('button', { type: 'button', class: 'btn danger', onclick: () => { S.meta.subjects = S.meta.subjects.filter((x) => x !== s); saveMeta(); paint(); } }, '삭제'))));
  paint();
  const input = h('input', { type: 'text', placeholder: '새 과목 이름 (예: 한국사)', maxlength: 30, 'aria-label': '새 과목 이름' });
  const add = () => {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    S.meta.subjects.push({ id: newId('s'), name, color: S.meta.subjects.length % 6 });
    input.value = ''; saveMeta(); paint(); input.focus();
  };
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(); } });
  dialog({
    title: '과목 관리',
    body: h('div', null, listEl, h('div', { class: 'subj-row' }, input, h('button', { type: 'button', class: 'btn', onclick: add }, '추가')),
      h('p', { style: 'margin-top:10px;font-size:13px' }, '과목을 삭제해도 노트는 지워지지 않고 "과목 없음"으로 남아요.')),
    actions: [{ label: '완료', kind: 'primary' }],
    onClose: () => { renderChips(); renderList(); if (!S.review && S.tab === 'text') renderEditor(); },
  });
}
function exportMarkdown(note) {
  const s = subjectOf(note);
  const lines = [`# ${note.title.trim() || '제목 없는 노트'}`, '',
    `- 과목: ${s ? s.name : '없음'}`, `- 작성: ${ymd(new Date(note.created))}`, note.tags.length ? `- 태그: ${note.tags.join(', ')}` : null, '', '## 필기', ''];
  for (const r of note.rows) {
    if (!r.cue.trim() && !r.body.trim()) continue;
    if (r.cue.trim()) lines.push(`**${r.cue.trim().replace(/\n+/g, ' ')}**`, '');
    if (r.body.trim()) lines.push(r.body.trim(), '');
  }
  if (note.summary.trim()) lines.push('## 요약', '', note.summary.trim(), '');
  if (note.inkPages) lines.push(`> 손필기 ${note.inkPages}쪽은 이 파일에 들어가지 않아요. 백업(.json)에는 포함돼요.`, '');
  const name = (note.title.trim() || '노트').replace(/[\\/:*?"<>|\n]+/g, ' ').slice(0, 60).trim() || '노트';
  saveFile(`${name}.md`, lines.filter((l) => l != null).join('\n'));
}
async function exportBackup() {
  flush();
  const ink = {};
  try {
    for (const n of S.notes.values()) for (let p = 0; p < n.inkPages; p++) {
      const path = `${n.id}/ink/p${p}`;
      const pending = saver.pending.get(path);
      const doc = pending ? pending() : await backend.get(path);
      if (doc) ink[path] = doc;
    }
  } catch { toast('손필기를 읽지 못해 백업을 멈췄어요. 다시 시도해 주세요.'); return; }
  const data = { app: 'miljul', version: 1, exported: new Date().toISOString(), meta: S.meta, notes: [...S.notes.values()].map((n) => ({ id: n.id, ...serializeNote(n) })), ink };
  saveFile(`miljul-backup-${ymd()}.json`, JSON.stringify(data));
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { data = null; }
  if (!data || data.app !== 'miljul' || !Array.isArray(data.notes)) { toast('밑줄 백업 파일이 아니에요. .json 백업 파일을 골라 주세요.'); return; }
  for (const s of data.meta?.subjects || []) {
    if (s && s.id && !S.meta.subjects.some((x) => x.id === s.id)) S.meta.subjects.push({ id: String(s.id), name: String(s.name || '이름 없는 과목'), color: Number(s.color) || 0 });
  }
  saveMeta();
  const valid = /^[A-Za-z0-9_-]{1,60}$/;
  let count = 0;
  for (const raw of data.notes) {
    if (!raw || !valid.test(raw.id)) continue;
    const note = normalizeNote(raw.id, raw);
    S.notes.set(note.id, note);
    queueSave(note.id, () => (S.notes.has(note.id) ? serializeNote(S.notes.get(note.id)) : null));
    count++;
  }
  for (const [path, doc] of Object.entries(data.ink || {})) {
    const m = /^([A-Za-z0-9_-]{1,60})\/ink\/p\d{1,3}$/.exec(path);
    if (m && S.notes.has(m[1]) && doc && Array.isArray(doc.strokes)) queueSave(path, () => doc);
  }
  renderChips(); renderList(); renderEditor();
  toast(`노트 ${count}개를 가져왔어요. 같은 노트는 백업 내용으로 덮어썼어요.`);
}

/* ================= 이벤트 · 시작 ================= */
$('#new-note').addEventListener('click', () => { if (S.ready) createNote(); });
$('#q').addEventListener('input', (e) => { S.q = e.target.value; renderList(); });
$('#status').addEventListener('click', () => { saver.failed = false; flush(); });
const menu = $('#menu'), menuBtn = $('#menu-btn');
const closeMenu = () => { menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); };
menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; menuBtn.setAttribute('aria-expanded', String(!menu.hidden)); });
document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
menu.addEventListener('click', (e) => {
  const act = e.target.closest('button')?.dataset.act;
  if (!act) return;
  closeMenu();
  if (!S.ready) return;
  if (act === 'subjects') openSubjects();
  else if (act === 'export') exportBackup();
  else if (act === 'import') $('#import-file').click();
});
$('#import-file').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f && S.ready) importBackup(f); });
addEventListener('pagehide', flush);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
document.fonts?.ready.then(() => { const sheet = $('#editor .sheet'); if (sheet) growAll(sheet); });

let booting = false;
async function boot() {
  if (booting) return;
  booting = true;
  S.loadError = false;
  setStatus(); renderList(); renderEditor();
  try {
    backend = backend || await pickBackend();
    const { meta, notes } = await Promise.race([backend.loadAll(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 12000))]);
    if (meta && Array.isArray(meta.subjects)) S.meta.subjects = meta.subjects.filter((s) => s && s.id).map((s) => ({ id: String(s.id), name: String(s.name || '이름 없는 과목'), color: Number(s.color) || 0 }));
    S.notes = new Map(notes.map(({ id, data }) => [id, normalizeNote(id, data)]));
    S.ready = true;
  } catch { S.loadError = true; }
  booting = false;
  setStatus(); renderChips();
  if (S.ready && wide()) { const first = visibleNotes()[0]; if (first) S.currentId = first.id; }
  renderList(); renderEditor();
}
boot();
})();
</script>
